# Nginx reverse proxy configuration for PashuX AI
# Supports WebSockets, long-lived MJPEG streaming, and file uploads up to 500MB

server {
    listen 80;
    server_name _; # Replace with your custom domain or Cloud Public IP

    client_max_body_size 500M;
    proxy_read_timeout 3600;
    proxy_connect_timeout 3600;
    proxy_send_timeout 3600;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live MJPEG CCTV stream response
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
