version: '3.8'

services:
  pashux-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pashux_production_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WEB_DASHBOARD_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./captures:/app/captures
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
